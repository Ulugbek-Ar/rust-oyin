    document.getElementById('exp').onclick = function () { code.value = btoa(unescape(encodeURIComponent(JSON.stringify(st)))); };
    document.getElementById('copy').onclick = function () {
      if (!code.value) code.value = btoa(unescape(encodeURIComponent(JSON.stringify(st))));
      try { navigator.clipboard.writeText(code.value).then(function () { toast('Nusxalandi'); }, function () { code.select(); toast('Belgilandi: nusxalang'); }); } catch (e) { code.select(); }
    };
    document.getElementById('imp').onclick = function () {
      try { var d = JSON.parse(decodeURIComponent(escape(atob(code.value.trim())))); if (!d.lib) throw 0; st = d; st.set = st.set || {}; save(); applySet(); toast('Kutubxona tiklandi'); settings(); }
      catch (e) { toast('Kod noto\'g\'ri. Uni to\'liq nusxalaganingizni tekshiring'); }
    };
    var w = document.getElementById('wipe'), armed = false;
    w.onclick = function () { if (!armed) { armed = true; w.textContent = 'Ishonchingiz komilmi? Yana bosing'; setTimeout(function () { armed = false; w.textContent = 'Tozalash'; }, 4000); return; }
      st.lib = {}; save(); toast('Kutubxona tozalandi'); settings(); };
  }

  // ---------- player (play in browser, counts play time) ----------
  function play(g) {
    install(g);
    var r = st.lib[g.id]; r.plays = (r.plays || 0) + 1; r.last = Date.now(); save();
    var p = el('<div class="player" role="dialog" aria-label="' + esc(g.name) + '"><header><b>' + esc(g.name) + '</b><span id="pt">0:00</span><button type="button" id="close">✕ Chiqish</button></header><iframe allow="autoplay; fullscreen" title="' + esc(g.name) + '"></iframe></div>');
    document.body.appendChild(p);
    var f = p.querySelector('iframe'); f.src = g.web.page;
    f.addEventListener('load', function () { try { f.contentWindow.focus(); f.contentDocument.getElementById('glcanvas').focus(); } catch (e) {} });
    if (st.set.fs && p.requestFullscreen) { try { var q = p.requestFullscreen(); if (q && q.catch) q.catch(function () {}); } catch (e) {} }
    var sess = 0, tick = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      sess++; r.sec = (r.sec || 0) + 1; if (sess % 5 === 0) save();
      document.getElementById('pt').textContent = Math.floor(sess / 60) + ':' + ('0' + sess % 60).slice(-2);
    }, 1000);
    function close() { clearInterval(tick); save(); if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} } p.remove(); document.removeEventListener('keydown', esc2); route(); }
    function esc2(e) { if (e.key === 'Escape' && !document.fullscreenElement) close(); }
    document.getElementById('close').onclick = close; document.addEventListener('keydown', esc2);
  }

  // ---------- routing ----------
  function applySet() {
    var root = document.documentElement, s = st.set;
    if (s.skin === 'dark' || s.skin === 'light') root.setAttribute('data-skin', s.skin); else root.removeAttribute('data-skin');
    document.body.classList.toggle('lite', !!s.lite);
  }
  function route() {
    var h = (location.hash || '#bosh').slice(1), tab = h;
    if (h.indexOf('o-') === 0 && game(h.slice(2))) { detail(game(h.slice(2))); tab = 'bosh'; }
    else if (h === 'kutubxona') library(); else if (h === 'sozlamalar') settings(); else { home(); tab = 'bosh'; }
    document.querySelectorAll('nav.tabs a').forEach(function (a) { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  }
  icon(document.getElementById('logo'), 'ritsar');
  applySet();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
