name: Android APK

on:
  push:
    branches: [main, ccr-6beb9320-7sxxbq]
    paths-ignore: ['ajdar/**', 'hokkey/**', 'mudofaa/**', 'pamir/**', 'buzar/**', 'site/**', '.github/workflows/buzar.yml', '.github/workflows/pamir.yml', '.github/workflows/mudofaa.yml', '.github/workflows/ajdar.yml', '.github/workflows/hokkey.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump version (each build installs as an update)
        run: |
          sed -i "s/^version_code = .*/version_code = $((100 + ${{ github.run_number }}))/; s/^version_name = .*/version_name = \"1.${{ github.run_number }}\"/" Cargo.toml
          grep -E "^version_(code|name)" Cargo.toml

      - name: Build APK (cargo-quad-apk)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk \
            bash -c "rustup update stable && rustup default stable && \
                     rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android && \
                     cargo quad-apk build --release"
          sudo cp target/android-artifacts/release/apk/zulmat.apk raw.apk
          sudo chown $USER raw.apk

      - name: Restore signing key (stable across builds)
        uses: actions/cache@v4
        with:
          path: signing.jks
          key: pikselqala-signing-key-v1
      - name: Re-sign APK (zipalign + apksigner v1/v2/v3)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          zip -q -d raw.apk 'META-INF/*' || true
          $BT/zipalign -f -p 4 raw.apk aligned.apk
          [ -f signing.jks ] || keytool -genkeypair -keystore signing.jks -storepass pikselqala -keypass pikselqala -alias pq -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Piksel Qala, O=Piksel Qala, C=UZ"
          $BT/apksigner sign --ks signing.jks --ks-pass pass:pikselqala --key-pass pass:pikselqala \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out QALA-RITSARI.apk aligned.apk
          $BT/apksigner verify -v QALA-RITSARI.apk
          $BT/aapt dump badging QALA-RITSARI.apk | grep -E "package:|sdkVersion|targetSdk|native-code|application:|launchable"
          $BT/aapt dump xmltree QALA-RITSARI.apk AndroidManifest.xml | grep -E "exported|icon|label"
          ls -lh QALA-RITSARI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QALA-RITSARI-apk
          path: QALA-RITSARI.apk

      - name: Publish to GitHub Release (sayt shu havoladan yuklaydi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apk QALA-RITSARI.apk --clobber --repo ${{ github.repository }}

      - name: Telegram kanalga yuborish
        if: ${{ env.TG_TOKEN != '' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tg]')) }}
        run: |
          curl -sS -f -F chat_id="$TG_CHAT" -F document=@QALA-RITSARI.apk \
            -F caption="🌑 ZULMAT — demo v0.1
          Zulmatda yorug'lik bo'l! Neon arena survivor, Rust'da yozilgan.

          🎮 Chap tomon — joystik, o'ng tomon — dash, nishon avtomatik.
          ⬇️ APK ni o'rnating va rekordingizni izohda yozing!" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" > /dev/null
          echo "Yuborildi"

  emulator-test:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QALA-RITSARI-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator and dump logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            sleep 20
            adb install -r QALA-RITSARI.apk
            adb logcat -c
            adb shell am start -W -n uz.pikselqala.ritsar.zulmat/.MainActivity
            sleep 20
            adb shell pidof uz.pikselqala.ritsar.zulmat || echo "=== PROCESS NOT RUNNING ==="
            echo "=== CRASH BUFFER ===" && adb logcat -b crash -d | tail -60
            echo "=== APP LOG ===" && adb logcat -d -v brief | grep -E "ZQ|SAPP|RustStdout|ritsar|AndroidRuntime|DEBUG  |libc    " | grep -v "BroadcastQueue\|GCM\|FontLog" | tail -80
