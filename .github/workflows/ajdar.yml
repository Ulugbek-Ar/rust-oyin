name: Ajdar Parvozi APK

on:
  push:
    branches: [main, ccr-6beb9320-7sxxbq]
    paths: ['ajdar/**', '.github/workflows/ajdar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version (each build installs as an update)
        run: |
          sed -i "s/^version_code = .*/version_code = $((100 + ${{ github.run_number }}))/; s/^version_name = .*/version_name = \"1.${{ github.run_number }}\"/" ajdar/Cargo.toml
          grep -E "^version_(code|name)" ajdar/Cargo.toml
      - name: Build APK (cargo-quad-apk)
        run: |
          docker run --rm -v "$PWD/ajdar":/root/src -w /root/src notfl3/cargo-apk \
            bash -c "rustup update stable && rustup default stable && \
                     rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android && \
                     cargo quad-apk build --release"
          sudo cp ajdar/target/android-artifacts/release/apk/ajdar.apk raw.apk
          sudo chown $USER raw.apk
      - name: Restore signing key (stable across builds)
        uses: actions/cache@v4
        with:
          path: signing.jks
          key: pikselqala-signing-key-v1
      - name: Sign APK (zipalign + apksigner)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          zip -q -d raw.apk 'META-INF/*' || true
          $BT/zipalign -f -p 4 raw.apk aligned.apk
          [ -f signing.jks ] || keytool -genkeypair -keystore signing.jks -storepass pikselqala -keypass pikselqala -alias pq -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Piksel Qala, O=Piksel Qala, C=UZ"
          $BT/apksigner sign --ks signing.jks --ks-pass pass:pikselqala --key-pass pass:pikselqala --out AJDAR-PARVOZI.apk aligned.apk
          $BT/apksigner verify AJDAR-PARVOZI.apk
          $BT/aapt dump badging AJDAR-PARVOZI.apk | grep -E "package:|application:|native-code"
          ls -lh AJDAR-PARVOZI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AJDAR-PARVOZI-apk
          path: AJDAR-PARVOZI.apk
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apk AJDAR-PARVOZI.apk --clobber --repo ${{ github.repository }}

  emulator-test:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AJDAR-PARVOZI-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            sleep 20
            adb install -r AJDAR-PARVOZI.apk
            adb logcat -c
            adb shell am start -W -n uz.pikselqala.ajdar/.MainActivity
            sleep 20
            adb shell pidof uz.pikselqala.ajdar || echo "=== PROCESS NOT RUNNING ==="
            echo "=== CRASH BUFFER ===" && adb logcat -b crash -d | tail -40
            echo "=== APP LOG ===" && adb logcat -d -v brief | grep -E "ZQ|SAPP|AndroidRuntime" | tail -40
