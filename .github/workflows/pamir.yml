name: Pamir Poygasi APK

on:
  push:
    branches: [main, ccr-6beb9320-7sxxbq]
    paths: ['pamir/**', '.github/workflows/pamir.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK (cargo-quad-apk)
        run: |
          docker run --rm -v "$PWD/pamir":/root/src -w /root/src notfl3/cargo-apk \
            bash -c "rustup update stable && rustup default stable && \
                     rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android && \
                     cargo quad-apk build --release"
          sudo cp pamir/target/android-artifacts/release/apk/pamir.apk raw.apk
          sudo chown $USER raw.apk
      - name: Sign APK (zipalign + apksigner)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          zip -q -d raw.apk 'META-INF/*' || true
          $BT/zipalign -f -p 4 raw.apk aligned.apk
          keytool -genkeypair -keystore k.jks -storepass pamir123 -keypass pamir123 -alias pamir \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Piksel Qala, O=Piksel Qala, C=UZ"
          $BT/apksigner sign --ks k.jks --ks-pass pass:pamir123 --key-pass pass:pamir123 --out PAMIR-POYGASI.apk aligned.apk
          $BT/apksigner verify PAMIR-POYGASI.apk
          $BT/aapt dump badging PAMIR-POYGASI.apk | grep -E "package:|application:|native-code"
          ls -lh PAMIR-POYGASI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PAMIR-POYGASI-apk
          path: PAMIR-POYGASI.apk
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          files: PAMIR-POYGASI.apk
          overwrite_files: true

  emulator-test:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PAMIR-POYGASI-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            sleep 20
            adb install -r PAMIR-POYGASI.apk
            adb logcat -c
            adb shell am start -W -n uz.pikselqala.pamir/.MainActivity
            sleep 20
            adb shell pidof uz.pikselqala.pamir || echo "=== PROCESS NOT RUNNING ==="
            echo "=== CRASH BUFFER ===" && adb logcat -b crash -d | tail -40
            echo "=== APP LOG ===" && adb logcat -d -v brief | grep -E "ZQ|SAPP|AndroidRuntime" | tail -40
